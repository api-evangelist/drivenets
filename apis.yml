aid: drivenets
name: DriveNets
description: >-
  DriveNets is a networking software company that applies the disaggregated cloud model
  to telco-grade and AI networking. Its DriveNets Network Cloud runs DNOS, a cloud-native
  distributed network operating system, across shared white-box hardware to serve core,
  aggregation, access, peering, DCI, and AI-fabric use cases. The Network Cloud AI fabric
  delivers Ethernet-based GPU-cluster interconnect positioned as an alternative to
  InfiniBand. Founded in 2015, DriveNets powers disaggregated backbones for operators
  including AT&T, Comcast, Orange, and KDDI. Device management is exposed programmatically
  via NETCONF/gNMI over OpenConfig and DriveNets YANG models, with a first-party
  drivenets.dnos Ansible collection for automation; there is no public REST API.
